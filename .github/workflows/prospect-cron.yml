name: Prospection automatique

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Déclenche un cycle de prospection
        run: |
          curl -sf -X POST "${{ secrets.SENTIA_APP_URL }}/api/cron/prospect" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
