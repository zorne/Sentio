name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # L'adresse des fonctions serveur est exigée par la construction ET par le contrôle de types de
    # l'interface : SvelteKit en engendre les types. Ce n'est pas un secret — elle est livrée au
    # navigateur — et la valeur ci-dessous ne désigne rien : on vérifie du code, pas un déploiement.
    env:
      PUBLIC_SENTIO_FUNCTIONS_URL: https://exemple.invalid/functions/v1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      # La vitrine se construit en sortie statique. L'adresse des fonctions n'est pas un secret —
      # elle est livrée au navigateur — mais elle est obligatoire : une vitrine qui ne sait pas où
      # parler ne doit pas se construire en silence.
      - name: Construction de l'interface
        run: pnpm --filter @sentio/web run build

  # Les fonctions s'exécutent sous Deno, pas sous Node : les vérifier avec l'outillage du reste du
  # dépôt reviendrait à vérifier autre chose (docs/adr/0021, compromis 1).
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Le domaine partagé est recopié ici, jamais versionné (docs/adr/0023). L'étape suivante
      # échouerait si cette recopie était oubliée — c'est le but.
      - name: Recopie du code partagé
        run: pnpm run functions:sync

      - name: Contrôle de types des fonctions
        run: deno check supabase/functions/diagnostic/index.ts

      - name: Tests des fonctions
        run: deno test --allow-env supabase/functions/diagnostic/

  # Le schéma porte des garanties que le code ne peut pas rattraper : ADN immuable, journal en
  # ajout seul, idempotence, isolation par entreprise. Elles se vérifient sur une vraie base,
  # pas par relecture.
  #
  # Ce job exécute aussi les tests d'intégration des repositories. Ils ne sont pas dans `verify`
  # parce qu'ils exigent une base — et ils ne sont pas facultatifs pour autant : trois bugs réels
  # ont vécu sous une suite verte qui ne tournait que contre un client factice.
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Migrations et invariants
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sentio_test
        run: supabase/tests/run.sh

      # SENTIO_REQUIRE_DB_TESTS déclare que ces tests DOIVENT s'exécuter ici. Sans lui, retirer
      # DATABASE_URL les ferait sauter en silence et l'étape resterait verte.
      # Deux paquets ont des tests qui exigent une base : les repositories, et le câblage du
      # noyau (plafonds lus dans plan_quota, décisions journalisées). Les faire tourner ailleurs
      # reviendrait à ne tester que des doublures — ce qui a déjà laissé passer trois bugs.
      - name: Repositories et noyau contre une vraie base
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sentio_test
          SENTIO_REQUIRE_DB_TESTS: "1"
        run: pnpm --filter @sentio/db --filter @sentio/worker test
